#list of keywords to look for in the corpora, separated by commas.
#keywords are not counted when they are part of another word,
#only when they stand alone in the text
keywords=one,two,three
#prefix for directories that contain text corpora
file_corpus_prefix=corpus_
#pause period for the directory crawler, in ms
dir_crawler_sleep_time=1000
#limit for the file scanner component, in bytes
file_scanning_size_limit=1024
#number of hops the web scanner component makes while crawling
hop_count=1
#time after which the set of visited URLs is cleared, in ms
url_refresh_time=86400000
